name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0 bandit mypy
      - run: ruff check src tests spec examples tools assets
      - run: ruff format --check src tests spec examples tools assets
      - name: quoted numbers (make sync-check)
        # Every number the documentation quotes about the suite and the version is derived, not
        # typed: `tools/sync_counts.py` reads what pytest collects and rewrites the prose, and this
        # step refuses a tree where they have drifted. A contributor runs `make sync`; a commit that
        # forgets fails here rather than shipping a number a reader cannot check.
        run: |
          pip install pytest
          python3 tools/sync_counts.py --check
      - name: mypy (the package is annotated, so the annotations are held to it)
        # The `Typing :: Typed` classifier and the `py.typed` marker are a claim that a
        # consumer's type checker can read this package's annotations. Without this job the
        # claim is decoration: the package was annotated all along, and 65 of those
        # annotations were wrong, which nobody could see because nothing asked.
        run: mypy --ignore-missing-imports src/docket
      - name: bandit (static security analysis)
        # The suppressions live in [tool.bandit] in pyproject.toml, each with its reason.
        # What remains has to be clean: this is a tool whose whole pitch is that a run is
        # auditable, so its own code is held to the same standard.
        run: bandit -q -c pyproject.toml -r src tools

  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        # Both are optional for *users* and required for the whole suite to run here rather than
        # skip: cryptography for the Ed25519 tests, PyYAML for tests/test_deploy_check.py (the tool
        # it covers exits 2 without it, which is a failed run, never a silent pass). Installing them
        # keeps this job at 0 skips, so a skip in CI means something changed.
        run: pip install pytest cryptography pyyaml uv
      - name: Install the package under test
        # The CLI tests exercise the `docket` console script, which is what a user types. Running
        # them against a tree that has not been installed measures an environment nobody is in:
        # tests/test_action.py executes the action's own shell, and that shell calls `docket`, so
        # without this the job fails with "command not found" on a repository that is fine.
        #
        # `uv` is installed for the same reason: `tests/test_packaging.py` runs `uv tool install`
        # against the published release, and a README command nothing executes is a command nobody
        # has checked. It skips with that reason when `uv` is absent, so leaving it out would make
        # the whole uv path silent.
        run: pip install .
      # No `-q` on any pytest line in this repository: `pyproject.toml`'s `addopts` carry one, a
      # second asks for `-qq`, and at that level pytest prints no counts line — so the job would
      # end green with nothing in the log saying how many tests passed. `-ra` prints the skip
      # reasons, and this job installs both extras so that there are none to print.
      - run: PYTHONPATH=src python -m pytest tests -ra
      - name: Self-test (the probes a cron would run against a deployment)
        # 19 probes that start a real boundary, a real upstream and real child processes in this
        # runner: forwarding, refusal, caps, throttling, the breaker, fault injection, the response
        # cache, a failing disk, and offline verification. It runs in CI because a self-test that is
        # only ever run by hand is a self-test nobody notices breaking. 6 s, offline.
        run: PYTHONPATH=src python -m docket selftest
      - name: Game day (every failure phase, end to end)
        # Nine scripted incidents against the shipped code — including the cache brake, the rollback
        # drill and a SIGKILLed supervisor — each declaring its expectations in advance and checked
        # against the ledger, the receipt and the disk. ~20 s, offline, and the output names any
        # phase that missed one.
        run: PYTHONPATH=src python -m docket game-day --out "$(mktemp -d)/game-day"

  conformance:
    name: conformance (independent verifier, node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Verify the committed vectors with the independent implementation
        run: node verify-js/test.mjs
      - name: Cross-check both implementations against the same receipt
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 spec/vectors/generate.py
          git diff --exit-code spec/vectors/ || {
            echo "::error::spec/vectors changed. Regenerate deliberately and commit the bytes."
            exit 1
          }

  verify-go:
    name: verify-go (a third implementation, written from the spec alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: false
      - name: Vet, format and test
        # The point of this job is not that Go code compiles. It is that a verifier written from
        # spec/ by someone who did not read the other two agrees with the corpus, byte for byte.
        run: |
          cd verify-go
          GOPROXY=off GOFLAGS=-mod=readonly go vet ./...
          test -z "$(gofmt -l .)"
          GOPROXY=off go test ./...
          GOPROXY=off go build -o docket-verify .
      - name: Hold all three implementations to the corpus
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 tools/conformance.py --python --node --go
          PYTHONPATH=src python3 tools/conformance.py --python --node --go --capabilities

  deploy:
    name: "deploy artefacts (static: no container runtime is used, and none is pretended)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the checker's dependencies
        # PyYAML reads the manifests. Without it tools/deploy_check.py exits 2 — a failed run, never a
        # silent pass — and this step is what stops that from being discovered by a user.
        # pytest is needed by the step below, which proves the checker can actually fail; the
        # runner image ships neither, so both are installed here rather than assumed.
        run: pip install pyyaml pytest
      - name: Check deploy/ (manifests, chart, compose, Dockerfile)
        run: make deploy-check
      - name: The checker fails on a broken artefact
        # The load-bearing half: tests/test_deploy_check.py breaks every invariant on purpose, one
        # fixture per check, so a checker that cannot fail cannot pass this job either.
        run: PYTHONPATH=src python -m pytest tests/test_deploy_check.py -ra

  docs:
    name: "docs (mkdocs build --strict: no broken links, no stranded pages)"
    # `.github/workflows/docs.yml` *deploys* Pages, on a manual trigger, when a maintainer asks it
    # to. This job is the other half: the site is built strictly on every push, so a broken relative
    # link or a page outside the navigation is a red build on the pull request that caused it,
    # instead of a surprise the next time somebody deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the site builder
        # `mkdocs-material` is not a development requirement of the package, so it is installed for
        # this job only. `tools/build_docs_site.py` exits 2 when mkdocs is missing rather than
        # quietly reporting success — "could not run" is not "passed".
        run: pip install mkdocs-material
      - name: Build the site, strictly
        # `--strict` turns a broken relative link or a page outside the navigation into a failure.
        # It is the cheapest way to keep twenty documents mutually consistent, and it runs against a
        # *staged* copy of the tree (see tools/build_docs_site.py) so that links to files outside
        # `docs/` stay valid on GitHub and on the site at the same time.
        run: make site-check

      # The site is the only HTML this project publishes, and --strict only proves it builds.
      # `make a11y` builds `site/` for real and then checks it — not `--site site` on its own,
      # because the step above builds to a temp directory and leaves nothing to read: the first
      # version of this step pointed at a directory that did not exist, which the checker would
      # have reported as exit 2 (could not run) rather than as a pass.
      - name: Build the site, then check it for accessibility defects
        run: make a11y

  package:
    name: package (clean install, then run it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a clean venv and use it as a user would
        run: |
          set -euo pipefail
          python -m venv /tmp/clean
          # The distribution name, not the command. PyPI prohibits the bare name `docket`, so
          # what `pip install` takes is `docket-ai` while the console script stays `docket`.
          # Read from pyproject.toml rather than written twice, so a rename cannot leave this
          # job installing a name the build does not produce.
          DIST="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          /tmp/clean/bin/pip install --no-index --find-links dist "$DIST"
          /tmp/clean/bin/docket --version
          cd "$(mktemp -d)"
          /tmp/clean/bin/docket demo | tee /tmp/demo.out
          grep -q "VERIFIED" /tmp/demo.out
          grep -q "Runaway loop" /tmp/demo.out
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
