name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (the tag gate runs the whole suite, skips and all)
        run: pip install build pytest cryptography pyyaml
      - name: Test the tag before shipping it
        # `-ra`, and no `-q`: `addopts` already carries one and a second would suppress the
        # counts line. The release log is the evidence that the tag was tested.
        run: PYTHONPATH=src python -m pytest tests -ra
      - name: Build
        run: python -m build
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Extract this version's notes
        # The changelog is 100 KB and leads with [Unreleased], so a 0.1.0 release whose notes
        # open with unreleased work tells a reader nothing about 0.1.0. Take the one section
        # whose heading names this tag. An empty result fails the job: a release with no notes
        # is worse than a failed run, because the failure is visible and the release is not.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {f=1; print; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md has no section for $VERSION; refusing to publish a release with no notes" >&2
            exit 1
          fi
          cat RELEASE_NOTES.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Docket ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
      # PyPI publishing is intentionally manual until the project has its own token:
      #   twine upload dist/*   (see PUBLISH.md in the maintainer runbook)
