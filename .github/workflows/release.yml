name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies (the tag gate runs the whole suite, skips and all)
        run: pip install build pytest cryptography pyyaml
      - name: Install the package under test
        # `tests/test_action.py` executes the composite action's own `run:` blocks, and
        # `tests/test_packaging.py` runs an installed console script. Without this the tag gate
        # fails with `docket: command not found` — exit 127 — which is not a verdict about the tag
        # and reads as one. This is the same omission the CI `tests` job had, fixed there first and
        # missed here, so `tests/test_release_workflow.py` now holds the two jobs' install steps
        # together the way the freshness test does.
        run: pip install .
      - name: Test the tag before shipping it
        # `-ra`, and no `-q`: `addopts` already carries one and a second would suppress the
        # counts line. The release log is the evidence that the tag was tested.
        #
        # `DOCKET_PYPI_PROPAGATION_SECONDS` because this job runs against a version that was
        # uploaded minutes earlier, and PyPI's index propagates unevenly across edge caches. The
        # packaging tests wait for the index to serve the version before deciding whether they can
        # measure it at all, and the bound has to be long here and nowhere else: the wait is paid
        # at import, and a tree declaring an unpublished version should not spend three minutes
        # discovering that. Measured — the 0.2.4 tag gate read the index, found the version,
        # un-skipped the install, and CI's `pip` then resolved only the previous release.
        env:
          DOCKET_PYPI_PROPAGATION_SECONDS: "300"
        run: PYTHONPATH=src python -m pytest tests -ra
      - name: Build
        run: python -m build
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Resolve this version from the package, not from the ref name
        # `pyproject.toml` is the authoritative version. Deriving it from `${GITHUB_REF_NAME#v}`
        # meant the release title, the artifact names and the notes heading could disagree with
        # the package, and it made `workflow_dispatch` unusable: on a branch the ref name is
        # `main`, so the notes lookup looked for `## [main]` and the job failed whatever you
        # did. Read the version, then hold the tag to it. A mismatch fails here rather than
        # publishing a release whose name and contents disagree.
        id: version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name the version pyproject.toml declares (${VERSION}); refusing to publish" >&2
            exit 1
          fi
          echo "publishing ${VERSION} from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"
      - name: Extract this version's notes
        # The changelog is 100 KB and leads with [Unreleased], so a release whose notes
        # open with unreleased work tells a reader nothing about the release. Take the one section
        # whose heading names this version. An empty result fails the job: a release with no notes
        # is worse than a failed run, because the failure is visible and the release is not.
        run: |
          VERSION="${VERSION}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {f=1; print; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md has no section for $VERSION; refusing to publish a release with no notes" >&2
            exit 1
          fi
          cat RELEASE_NOTES.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          # A re-run has to be able to recover. `gh release create` exits non-zero when the
          # release already exists, so a re-run after a partial failure, or a run that follows a
          # release the maintainer already cut by hand, stopped here and the only way past it was
          # to delete the release. Upload onto the existing release instead: both the notes and
          # the artifacts are replaced from this run's own build, so the outcome is the same
          # release carrying this run's content.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading this run's artifacts onto it"
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --title "Docket ${VERSION}" --notes-file RELEASE_NOTES.md dist/*
          fi
      # PyPI upload stays a deliberate manual step rather than a `twine upload` in this job.
      # The reason is blast radius, not missing plumbing: a PyPI token is a credential that
      # can publish under the project's name forever and cannot be scoped to a branch, so
      # storing one as a repository secret hands it to everyone who ever gains admin on this
      # repository. The GitHub release is published by this workflow because `github.token`
      # is scoped to this run and expires with it. To ship a release to PyPI:
      #   python -m build && twine upload dist/*
      # which is also the only way to publish from a machine whose key never touches CI.
