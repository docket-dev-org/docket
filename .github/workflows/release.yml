name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - name: Test the tag before shipping it
        run: PYTHONPATH=src python -m pytest tests -q
      - name: Build
        run: python -m build
      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            dist/*
      # PyPI publishing is intentionally manual until the project has its own token:
      #   twine upload dist/*   (see PUBLISH.md in the maintainer runbook)
