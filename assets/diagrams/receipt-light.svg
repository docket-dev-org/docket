<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 772" width="980" height="772" role="img" aria-labelledby="receipt-light-title receipt-light-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif">
  <title id="receipt-light-title">The sections of a Docket receipt, grouped by what a reader asks</title>
  <desc id="receipt-light-desc">A receipt has 24 members. Grouped by question: which run it was (format, docket number, label, timestamp, tool); what it was allowed to do (policy, caps); what it cost (totals, model calls, price table, latency); what it touched (tools, files, network, ops); how to check it (ledger, event counts, appendix, evidence, seal, signature); and what it admits (limits disclosure, findings, proxy). Every number is an integer or a decimal string, and the limits disclosure is required.</desc>
  <rect x="0" y="0" width="980" height="772" class="page" fill="#F7F5EF"/>
  <defs>
    <marker id="light-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="line" stroke-width="1"/>
    </marker>
    <style>
      .page { fill: #F7F5EF; }
      .card { fill: #FFFFFF; }
      .raised { fill: #EFEDE6; }
      .text { fill: #17212B; }
      .secondary { fill: #3D4C5A; }
      .muted { fill: #55677A; }
      .accent { fill: #2457F5; }
      .accent-soft { fill: #E4EBFE; }
      .accent-text { fill: #12307F; }
      .border { fill: #D5CEBF; }
      .grid { fill: #DDD6C8; }
      .passed { fill: #17663F; }
      .failed { fill: #B3261E; }
      .skipped { fill: #7A5300; }
      .optional { fill: #55677A; }
      .line { stroke: #D5CEBF; fill: none; }
      .accent-line { stroke: #2457F5; fill: none; }
      .strong-line { stroke: #3D4C5A; fill: none; }
      .hairline { stroke: #DDD6C8; stroke-width: 1; fill: none; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .t-title { font-size: 19px; font-weight: 600; }
      .t-section { font-size: 15px; font-weight: 600; }
      .t-label { font-size: 13px; font-weight: 500; }
      .t-detail { font-size: 11px; }
      .t-micro { font-size: 10px; }
      text { dominant-baseline: middle; }
    </style>
  </defs>
  <text x="24" y="32" class="t-title sans t-title-fill" fill="#17212B" text-anchor="start">What is inside one receipt</text>
  <text x="24" y="60" class="t-detail sans t-detail-fill" fill="#3D4C5A" text-anchor="start">24 members, grouped by the question each answers rather than by the order the writer assembled them</text>
  <rect x="24" y="96" width="932" height="82" rx="8" class="card" fill="#FFFFFF" stroke="#D5CEBF" stroke-width="1.25"/>
  <rect x="24" y="96" width="4" height="82" rx="2" fill="#55677A"/>
  <text x="48" y="122" class="t-label sans t-label-fill" fill="#17212B" text-anchor="start">which run was this</text>
  <rect x="48" y="140" width="104" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="60" y="152" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">format</text>
  <rect x="164" y="140" width="104" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="176" y="152" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">docket_number</text>
  <rect x="280" y="140" width="104" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="292" y="152" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">label</text>
  <rect x="396" y="140" width="104" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="408" y="152" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">created_at</text>
  <rect x="512" y="140" width="104" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="524" y="152" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">tool</text>
  <rect x="24" y="194" width="932" height="82" rx="8" class="card" fill="#FFFFFF" stroke="#D5CEBF" stroke-width="1.25"/>
  <rect x="24" y="194" width="4" height="82" rx="2" fill="#2457F5"/>
  <text x="48" y="220" class="t-label sans t-label-fill" fill="#17212B" text-anchor="start">what it was allowed to do</text>
  <rect x="48" y="238" width="61" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="60" y="250" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">policy</text>
  <rect x="121" y="238" width="61" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="133" y="250" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">caps</text>
  <rect x="24" y="292" width="932" height="82" rx="8" class="card" fill="#FFFFFF" stroke="#D5CEBF" stroke-width="1.25"/>
  <rect x="24" y="292" width="4" height="82" rx="2" fill="#2457F5"/>
  <text x="48" y="318" class="t-label sans t-label-fill" fill="#17212B" text-anchor="start">what it cost</text>
  <rect x="48" y="336" width="92" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="60" y="348" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">totals</text>
  <rect x="152" y="336" width="92" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="164" y="348" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">model_calls</text>
  <rect x="256" y="336" width="92" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="268" y="348" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">price_table</text>
  <rect x="360" y="336" width="92" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="372" y="348" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">latency</text>
  <rect x="24" y="390" width="932" height="82" rx="8" class="card" fill="#FFFFFF" stroke="#D5CEBF" stroke-width="1.25"/>
  <rect x="24" y="390" width="4" height="82" rx="2" fill="#3D4C5A"/>
  <text x="48" y="416" class="t-label sans t-label-fill" fill="#17212B" text-anchor="start">what it touched</text>
  <rect x="48" y="434" width="67" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="60" y="446" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">tools</text>
  <rect x="127" y="434" width="67" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="139" y="446" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">files</text>
  <rect x="206" y="434" width="67" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="218" y="446" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">network</text>
  <rect x="285" y="434" width="67" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="297" y="446" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">ops</text>
  <rect x="24" y="488" width="932" height="82" rx="8" class="card" fill="#FFFFFF" stroke="#D5CEBF" stroke-width="1.25"/>
  <rect x="24" y="488" width="4" height="82" rx="2" fill="#2457F5"/>
  <text x="48" y="514" class="t-label sans t-label-fill" fill="#17212B" text-anchor="start">how you check it</text>
  <rect x="48" y="532" width="98" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="60" y="544" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">ledger</text>
  <rect x="158" y="532" width="98" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="170" y="544" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">event_counts</text>
  <rect x="268" y="532" width="98" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="280" y="544" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">appendix</text>
  <rect x="378" y="532" width="98" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="390" y="544" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">evidence</text>
  <rect x="488" y="532" width="98" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="500" y="544" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">seal</text>
  <rect x="598" y="532" width="98" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="610" y="544" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">signature</text>
  <rect x="24" y="586" width="932" height="82" rx="8" class="card" fill="#FFFFFF" stroke="#D5CEBF" stroke-width="1.25"/>
  <rect x="24" y="586" width="4" height="82" rx="2" fill="#B3261E"/>
  <text x="48" y="612" class="t-label sans t-label-fill" fill="#17212B" text-anchor="start">what it admits</text>
  <rect x="48" y="630" width="129" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="60" y="642" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">limits_disclosure</text>
  <rect x="189" y="630" width="129" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="201" y="642" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">findings</text>
  <rect x="330" y="630" width="129" height="24" rx="4" class="raised" fill="#EFEDE6"/>
  <text x="342" y="642" class="t-micro mono t-micro-fill" fill="#3D4C5A" text-anchor="start">proxy</text>
  <line x1="24" y1="692" x2="956" y2="692" class="hairline"/>
  <text x="24" y="720" class="t-detail sans t-detail-fill" fill="#55677A" text-anchor="start">No floats anywhere: every number is an integer or a decimal string, so the file hashes identically in every language.</text>
  <text x="24" y="744" class="t-detail sans t-detail-fill" fill="#55677A" text-anchor="start">limits_disclosure is required, not optional: a verifier fails a receipt that does not state what it could and could not observe.</text>
</svg>

