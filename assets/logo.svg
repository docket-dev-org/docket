<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Docket">
  <title>Docket</title>
  <desc>A receipt with a torn edge: the record of an agent run.</desc>
  <defs>
    <clipPath id="card">
      <path d="M12 6h40a6 6 0 0 1 6 6v33.5l-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5H12a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Z"/>
    </clipPath>
  </defs>
  <!-- receipt body -->
  <path d="M12 6h40a6 6 0 0 1 6 6v33.5l-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5-3.5-3.5-3.5 3.5H12a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6Z"
        fill="#4f46e5"/>
  <!-- three record lines, the middle one longer: entries in a ledger -->
  <g clip-path="url(#card)" stroke="#eef2ff" stroke-width="3.4" stroke-linecap="round">
    <line x1="15" y1="18" x2="35" y2="18"/>
    <line x1="15" y1="26" x2="49" y2="26"/>
    <line x1="15" y1="34" x2="41" y2="34"/>
  </g>
  <!-- the verified tick, outside the torn edge so it stays legible at 16px -->
  <path d="M40 44.5l5 5 11-11.5" fill="none" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
