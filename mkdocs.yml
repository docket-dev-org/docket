# Documentation site configuration.
#
# The repository is readable without this file — every document is plain Markdown and every
# link is relative, so GitHub renders the whole tree correctly. This exists for people who
# prefer a searchable site, and for turning the docs into GitHub Pages with one workflow:
#
#     pip install mkdocs-material && mkdocs serve       # preview at http://127.0.0.1:8000
#     mkdocs build --strict                             # fails on a broken internal link
#
# `--strict` is the point: it is the cheapest way to keep 15 documents mutually consistent.
#
# Note on `docs_dir`: it points at a staged copy of the tree (see tools/build_docs_site.py),
# not at `docs/`, because documents link to files outside `docs/` with paths that must stay
# valid on GitHub (`../ROADMAP.md`, `../spec/docket-receipt-1.md`). Staging keeps one set of
# links working in both places. Build with `make site`, never by calling mkdocs directly.

site_name: Docket
site_description: Every AI agent run gets a docket number — a hard spending cap and a tamper-evident receipt anyone can verify offline.
site_url: https://docket-dev.github.io/docket/
repo_url: https://github.com/docket-dev/docket
repo_name: docket-dev/docket
edit_uri: edit/main/docs/
copyright: Apache-2.0 for code · CC BY 4.0 for the specification

docs_dir: .mkdocs-site


theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Start here:
      - Quickstart: docs/quickstart.md
      - Concepts: docs/concepts.md
      - FAQ: docs/faq.md
  - Using it:
      - CLI reference: docs/cli.md
      - Policy reference: docs/policy-reference.md
      - Response cache: docs/caching.md
      - Integrations: docs/integrations.md
  - Trust:
      - What verification proves: docs/verification.md
      - Threat model and limits: docs/threat-model.md
      - Evidence: docs/evidence.md
      - Incident corpus: docs/incident-corpus.md
      - Format specification: spec/docket-receipt-1.md
      - Conformance (normative): spec/conformance.md
      - Check-id registry: spec/registry.json
  - Project:
      - Architecture: docs/architecture.md
      - Testing: docs/testing.md
      - Measurements (one host, 2026-10-15): docs/measurements/2026-10-15-2core/README.md
      - Resilience: docs/resilience.md
      - Deployment: docs/deployment.md
      - Deploy recipes: deploy/README.md
      - Production coverage: docs/production-coverage.md
      - Resilience practice coverage: docs/sre-coverage.md
      - Standards and papers behind the mechanisms: docs/standards.md
      - Comparison: docs/comparison.md
      - Changelog: CHANGELOG.md
      - Roadmap: ROADMAP.md
      - Governance: GOVERNANCE.md
      - Maintainers: MAINTAINERS.md
      - Contributors: CONTRIBUTORS.md
      - Code of conduct: CODE_OF_CONDUCT.md
      - Contributing: CONTRIBUTING.md
      - Security policy: SECURITY.md
      - Support: SUPPORT.md
      - Supporting Docket: SPONSORS.md
      - Decisions (ADRs):
          - 0001 Record format decisions as ADRs: docs/adr/0001-record-format-decisions-as-adrs.md
          - 0002 No floating point in hashed structures: docs/adr/0002-no-floating-point-in-hashed-structures.md
          - 0003 Verification uses recomputed hashes: docs/adr/0003-verification-uses-recomputed-hashes.md
          - 0004 Content snapshots and confinement: docs/adr/0004-content-snapshots-and-confinement.md
          - 0005 One writer at a time: docs/adr/0005-concurrency-and-one-writer-at-a-time.md
          - 0006 The shape of the conformance corpus: docs/adr/0006-the-shape-of-the-conformance-corpus.md
          - 0007 Members a receipt states about its own rows: docs/adr/0007-the-members-a-receipt-states-about-itself.md
          - 0008 A third implementation from the spec alone: docs/adr/0008-a-third-implementation-written-from-the-spec.md
  - Examples:
      - Examples index: examples/README.md
      - Quickstart example: examples/quickstart/README.md
      - CI example: examples/ci/README.md
      - Client deliverable: examples/client-deliverable/README.md
      - Subscription mode: examples/subscription/README.md
      - Custom agent (policy + script): examples/custom-agent/README.md
