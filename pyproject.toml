[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docket"
version = "0.1.0"
description = "Every AI agent run gets a docket number: hard spending caps and a tamper-evident receipt anyone can verify offline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Docket contributors" }]
keywords = [
  "ai-agents",
  "llm",
  "observability",
  "audit",
  "provenance",
  "cost-control",
  "guardrails",
  "transparency-log",
  "tamper-evident",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Logging",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mkdocs-material>=9.5"]

[project.scripts]
docket = "docket.cli:main"

[project.urls]
Homepage = "https://github.com/docket-dev/docket"
Documentation = "https://github.com/docket-dev/docket/tree/main/docs"
Specification = "https://github.com/docket-dev/docket/blob/main/spec/docket-receipt-1.md"
Issues = "https://github.com/docket-dev/docket/issues"
Changelog = "https://github.com/docket-dev/docket/blob/main/CHANGELOG.md"
Sponsor = "https://github.com/sponsors/docket-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/docket"]

[tool.hatch.build.targets.sdist]
include = ["src", "spec", "tests", "docs", "examples", "verify-js", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "SIM108"]

[tool.coverage.run]
source = ["src/docket"]
