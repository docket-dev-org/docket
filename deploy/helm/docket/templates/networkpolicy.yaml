{{ if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docket-agent
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: {{ .Values.instance }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docket
      app.kubernetes.io/instance: {{ .Values.instance }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
{{ end }}
